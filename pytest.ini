[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    smoke: critical-path tests (login, core CRUD) -- fast subset run on every push
    regression: full functional coverage -- run on schedule / before release
    api: backend REST API tests (no browser)
    ui: browser-driven frontend tests
addopts =
    --screenshot=only-on-failure
    --output=screenshots
    --html=reports/report.html
    --self-contained-html
    --log-file=reports/test_execution.log
    --log-file-level=INFO
    -ra
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
