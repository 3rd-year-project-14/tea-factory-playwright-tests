name: Playwright Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you trigger a full regression run manually from the Actions tab.
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke tests (fast, every push/PR)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Tea
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # This repo (tea-factory-playwright-tests), the backend, and the frontend
      # are three separate GitHub repos, not one monorepo -- each needs its own
      # checkout, laid out as siblings on the runner to match the working-directory
      # paths used below.
      - name: Checkout test suite
        uses: actions/checkout@v4
        with:
          path: playwright-tests

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: 3rd-year-project-14/tea-factory-backend
          path: tea-factory-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: 3rd-year-project-14/tea-factory-frontend-web
          path: tea-factory-frontend-web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # FirebaseConfig.java falls back to the local (gitignored) service-account
      # JSON file when FIREBASE_CREDENTIALS is unset -- that file doesn't exist on
      # the runner, so the Admin SDK (used to verify login tokens) needs the
      # secret passed in directly, base64-encoded, exactly as the deployed-container
      # path already supports.
      - name: Build & start backend (Spring Boot)
        working-directory: tea-factory-backend
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > backend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:8080/api/manager-info/ping

      - name: Install & start frontend (Vite dev server)
        working-directory: tea-factory-frontend-web
        run: |
          npm ci
          nohup npm run dev -- --port 5174 --strictPort > frontend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:5174

      - name: Install Python test dependencies
        working-directory: playwright-tests
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # NOTE: the suite authenticates against a real Firebase project (see
      # conftest.py::firebase_id_token) -- FIREBASE_API_KEY / TEST_USER_EMAIL /
      # TEST_USER_PASSWORD must be configured as repository secrets. This mirrors
      # the environment limitation already documented in INTERVIEW_NOTES.md
      # (Firebase auth can't be mocked away without changing the app itself).
      - name: Run smoke tests
        working-directory: playwright-tests
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pytest -m smoke -n auto

      - name: Upload HTML report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: |
            playwright-tests/reports/
            playwright-tests/screenshots/
          retention-days: 14

  full-regression:
    name: Full regression (manual / nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Tea
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4
        with:
          path: playwright-tests

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: 3rd-year-project-14/tea-factory-backend
          path: tea-factory-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: 3rd-year-project-14/tea-factory-frontend-web
          path: tea-factory-frontend-web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build & start backend
        working-directory: tea-factory-backend
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > backend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:8080/api/manager-info/ping

      - name: Install & start frontend
        working-directory: tea-factory-frontend-web
        run: |
          npm ci
          nohup npm run dev -- --port 5174 --strictPort > frontend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:5174

      - name: Install Python test dependencies
        working-directory: playwright-tests
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium firefox webkit

      - name: Run full suite (all browsers, parallel)
        working-directory: playwright-tests
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pytest -n auto

      - name: Upload HTML report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-report
          path: |
            playwright-tests/reports/
            playwright-tests/screenshots/
          retention-days: 14
